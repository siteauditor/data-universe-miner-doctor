name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: |
          PYPROJ_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PYPROJ_VER tag=$TAG_VER"
          test "$PYPROJ_VER" = "$TAG_VER"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/data-universe-miner-doctor
    permissions:
      id-token: write   # REQUIRED for PyPI Trusted Publishing (OIDC); no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: PyPI Trusted Publishing exchanges the OIDC identity.
        # One-time PyPI setup: add a Trusted Publisher for this repo, workflow
        # file "release.yml", environment "pypi".
        with:
          # Idempotent: if this version is already on PyPI (e.g. a re-pushed tag),
          # skip instead of failing the run.
          skip-existing: true
        # For a dry run, point at TestPyPI first, add:
        #   repository-url: https://test.pypi.org/legacy/
