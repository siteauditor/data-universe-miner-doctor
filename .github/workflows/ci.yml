name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # The suite runs fully offline: the bittensor SDK is mocked, so no live
      # chain/services are needed.
      - run: pip install -e ".[dev]"
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .   # CORE only — bittensor intentionally absent
      - name: du-doctor check --json produces valid JSON
        # bittensor missing -> overall CRITICAL -> exit code 2 (expected). We
        # assert that VALID JSON is produced, NOT that the exit code is 0.
        run: |
          set +e
          du-doctor check --json > out.json
          echo "du-doctor exit code: $?"
          set -e
          python - <<'PY'
          import json
          d = json.load(open("out.json"))
          assert isinstance(d, dict), "top-level JSON must be an object"
          assert "overall_status" in d and "checks" in d, "missing expected keys"
          print("valid JSON; overall_status =", d["overall_status"], "checks =", len(d["checks"]))
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
